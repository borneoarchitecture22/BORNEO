<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borneo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--w:#fafaf8;--b:#0d0d0b;--g:#9e9b96;--ease:cubic-bezier(0.76,0,0.24,1);}
html,body{width:100%;height:100%;overflow:hidden;background:var(--w);color:var(--b);font-family:'Inter',sans-serif;cursor:none;}
/* Instant background from cache */

/* ── CURSOR ── */
#cursor{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);width:7px;height:7px;background:var(--b);border-radius:50%;transition:width .18s,height .18s,background .18s;}
#cursor.grow{width:44px;height:44px;background:transparent;border:1px solid var(--b);}

/* ── BG ── */
#bg{position:fixed;inset:0;z-index:0;transition:background .4s;}

/* ── LOGO — top center ── */
#logo-wrap{
  position:fixed;top:36px;left:0;right:0;
  display:flex;justify-content:center;
  z-index:100;
  animation:fadeUp .5s var(--ease) both;
}
#logo-wrap a{cursor:none;display:block;text-decoration:none;}
#logo-img{height:28px;width:auto;display:block;mix-blend-mode:multiply;}
/* Text fallback if no logo image */
#logo-text{
  font-size:11px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;
  color:var(--b);text-decoration:none;cursor:none;
  display:none;
}

/* ── STAGE — center of screen ── */
#stage{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
}
.slide.active{pointer-events:auto;z-index:10;opacity:1;}
.slide.first-load{animation:fadeSlide .9s cubic-bezier(0.4,0,0.2,1) both;}
@keyframes fadeSlide{from{opacity:0}to{opacity:1}}
.slide-img{
  display:block;
  height:630px;
  width:auto;
  max-height:72vh;
  object-fit:contain;
  cursor:none;
  user-select:none;
  -webkit-user-drag:none;
}
.slide-placeholder{
  width:340px;height:630px;max-height:72vh;
  background:#e8e6e1;
  display:flex;align-items:center;justify-content:center;
}
.slide-placeholder span{
  font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--g);
}

/* ── TITLE — bottom center ── */
#title-wrap{
  position:fixed;bottom:48px;left:0;right:0;
  display:flex;justify-content:center;
  z-index:100;
  pointer-events:none;
  animation:fadeUp .8s var(--ease) .2s both;
}
#proj-title{
  font-size:11px;font-weight:300;font-style:italic;letter-spacing:.12em;
  color:var(--b);text-decoration:none;
  pointer-events:auto;cursor:none;
  border-bottom:1px solid transparent;
  transition:border-color .3s;
  padding-bottom:2px;
}
#proj-title:hover{border-bottom-color:var(--b);}
#proj-title.inactive{pointer-events:none;color:var(--g);}

/* ── CLICK ZONES — left/right halves ── */
#zone-left,#zone-right{
  position:fixed;top:0;bottom:0;z-index:50;
  width:50%;cursor:none;
}
#zone-left{left:0;}
#zone-right{right:0;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── MOBILE ── */
@media(max-width:768px){
  #logo-wrap{top:22px;}
  #title-wrap{bottom:24px;}
  .slide-img{height:auto!important;width:90vw!important;max-height:62vh;}
  .slide-placeholder{width:90vw;height:auto;min-height:260px;}
  #zone-left,#zone-right{width:50%;}
}
</style>

<script>
// Runs immediately — show cached state before any fetch
(function(){
  try{
    // Apply cached background instantly — no white flash
    var bg=localStorage.getItem('borneo_bg')||'#fafaf8';
    document.documentElement.style.background=bg;
    document.documentElement.style.setProperty('--w',bg);

    // Preload first cover image immediately
    var cover=localStorage.getItem('borneo_first_cover');
    if(cover){
      var l=document.createElement('link');
      l.rel='preload';l.as='image';l.href=cover;
      l.setAttribute('fetchpriority','high');
      document.head.appendChild(l);
    }

    // Show cached logo text immediately if no image yet
    var logoSrc=localStorage.getItem('borneo_logo');
    if(logoSrc){
      // Will be applied after DOM ready
      window._cachedLogo=logoSrc;
    }
  }catch(e){}
})();
</script>
</head>
<body>
<div id="cursor"></div>
<div id="bg"></div>

<div id="logo-wrap">
  <a href="about.html" id="logo-link">
    <img id="logo-img" src="" alt="Borneo">
    <span id="logo-text">Borneo</span>
  </a>
</div>

<div id="stage"></div>

<div id="title-wrap">
  <a id="proj-title" href="#" class="inactive">—</a>
</div>

<div id="zone-left"></div>
<div id="zone-right"></div>

<script>
let P=[],SS={},cur=0,anim=false;
const curEl=document.getElementById('cursor');

// Apply cached state immediately on DOM ready
(function(){
  try{
    var bg=localStorage.getItem('borneo_bg')||'#fafaf8';
    document.getElementById('bg').style.background=bg;
    document.body.style.background=bg;
    if(window._cachedLogo){
      var li=document.getElementById('logo-img');
      if(li){li.src=window._cachedLogo;li.style.display='block';}
    }
  }catch(e){}
})();

document.addEventListener('mousemove',e=>{
  curEl.style.left=e.clientX+'px';
  curEl.style.top=e.clientY+'px';
});

async function load(){
  try{
    const r=await fetch('content.json?v='+Date.now());
    const D=await r.json();
    SS=D.site||{};

    // Background
    const bgVal=(SS.background?.value)||'#fafaf8';
  document.getElementById('bg').style.background=bgVal;
  document.body.style.background=bgVal;
  try{localStorage.setItem('borneo_bg',bgVal);}catch(e){}
    document.body.style.background=(SS.background?.value)||'#fafaf8';

    // Logo
    const logoImg=document.getElementById('logo-img');
    const logoText=document.getElementById('logo-text');
    if(D.logo){
      logoImg.src=D.logo;
      logoImg.style.display='block';
      logoText.style.display='none';
    } else {
      logoImg.style.display='none';
      logoText.style.display='block';
    }

    P=D.projects||[];
    // Custom cursor
    if(D.cursor){
      const ci=document.getElementById('cursor');
      if(ci){
        ci.innerHTML='';
        const img=document.createElement('img');
        img.src=D.cursor;
        img.style.cssText='width:32px;height:32px;object-fit:contain;display:block;pointer-events:none;cursor:none;';
        ci.appendChild(img);
        ci.style.width='32px';
        ci.style.height='32px';
        ci.style.borderRadius='0';
        ci.style.background='transparent';
        ci.style.border='none';
      }
      // Force cursor:none everywhere
      document.body.style.cursor='none';
      const s=document.createElement('style');
      s.textContent='*{cursor:none!important;}';
      document.head.appendChild(s);
    }
    buildSlides();
    if(P.length){
    updateTitle(0);
    // Cache first cover for instant preload on next visit
    const firstCover=P[0]?.coverImage||P[0]?.image||'';
    if(firstCover)try{localStorage.setItem('borneo_first_cover',firstCover);}catch(e){}
  }
  }catch(e){
    // No content yet — show placeholder
    document.getElementById('logo-img').style.display='none';
    document.getElementById('logo-text').style.display='block';
  }
}

function buildSlides(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  P.forEach((p,i)=>{
    const slide=document.createElement('div');
    slide.className='slide'+(i===0?' active':'');
    slide.dataset.i=i;
    if(i>0)slide.style.opacity='0';

    const img=p.coverImage||p.image||'';
    const vid=p.coverVideo||p.video||'';

    if(vid){
      const v=document.createElement('video');
      v.src=vid;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;
      v.className='slide-img';
      v.style.height='630px';v.style.maxHeight='72vh';
      slide.appendChild(v);
    } else if(img){
      const im=document.createElement('img');
      im.src=img;im.alt=p.title||'';im.className='slide-img';im.draggable=false;
      im.loading=i===0?'eager':'lazy';
      if(i===0)im.fetchPriority='high';
      slide.appendChild(im);
    } else {
      const ph=document.createElement('div');ph.className='slide-placeholder';
      ph.innerHTML='<span>'+esc(p.title||'')+'</span>';
      slide.appendChild(ph);
    }
    stage.appendChild(slide);
  });
  // Fade in first slide elegantly
  const firstSlide=stage.querySelector('.slide.active');
  if(firstSlide){
    firstSlide.classList.add('first-load');
    firstSlide.addEventListener('animationend',()=>firstSlide.classList.remove('first-load'),{once:true});
  }
  // Preload first image immediately for fast display
  const firstImg=stage.querySelector('.slide img');
  if(firstImg)firstImg.loading='eager';
  // Preload second image in background
  if(P[1]){
    const preImg=new Image();
    preImg.src=P[1].coverImage||P[1].image||'';
  }
}

function navigate(dir){
  if(anim||P.length<2)return;
  const slides=document.querySelectorAll('.slide');
  const n=slides.length;
  const next=(cur+dir+n)%n;
  const speed=0.55;
  const ease='cubic-bezier(0.76,0,0.24,1)';
  anim=true;

  const curr=slides[cur],nxt=slides[next];
  // Simple fade
  nxt.style.transition='none';
  nxt.style.opacity='0';
  nxt.style.zIndex='11';
  curr.style.zIndex='10';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    nxt.style.transition=`opacity ${speed}s ${ease}`;
    curr.style.transition=`opacity ${speed}s ${ease}`;
    nxt.style.opacity='1';
    curr.style.opacity='0';
    cur=next;
    updateTitle(cur);
    setTimeout(()=>{
      curr.style.transition='none';
      curr.style.opacity='0';
      curr.style.zIndex='';
      nxt.style.zIndex='';
      anim=false;
      // Prefetch next image in background
      if(P.length>1){
        const ni=(cur+1)%P.length;
        const nsrc=P[ni]?.coverImage||P[ni]?.image||'';
        if(nsrc){const pl=document.createElement('link');pl.rel='prefetch';pl.as='image';pl.href=nsrc;document.head.appendChild(pl);}
      }
    },speed*1000+60);
  }));
}

function updateTitle(idx){
  const p=P[idx];
  if(!p)return;
  const el=document.getElementById('proj-title');
  el.textContent=p.title||'';
  const enabled=SS.projectPagesEnabled!==false;
  if(enabled&&p.id){
    el.href=`project.html?id=${p.id}`;
    el.classList.remove('inactive');
  } else {
    el.href='#';
    el.classList.add('inactive');
  }
}

// Click zones
document.getElementById('zone-left').addEventListener('click',()=>navigate(-1));
document.getElementById('zone-right').addEventListener('click',()=>navigate(1));

// Hover cursor grow on logo and title
[document.getElementById('logo-wrap'),document.getElementById('title-wrap')]
  .forEach(el=>{
    el.addEventListener('mouseenter',()=>curEl.classList.add('grow'));
    el.addEventListener('mouseleave',()=>curEl.classList.remove('grow'));
  });

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')navigate(-1);
  if(e.key==='ArrowRight'||e.key==='ArrowDown')navigate(1);
});

// Touch
let ty=0;
document.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dy=ty-e.changedTouches[0].clientY;
  if(Math.abs(dy)>40)navigate(dy>0?1:-1);
},{passive:true});

// Scroll
let ls=0;
document.addEventListener('wheel',e=>{
  e.preventDefault();
  const now=Date.now();
  if(now-ls<500)return;
  if(Math.abs(e.deltaY)<8)return;
  ls=now;navigate(e.deltaY>0?1:-1);
},{passive:false});

function esc(s){return String(s).replace(/</g,'&lt;');}
load();
</script>
</body>
</html>
